<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitura de Sensor Arduino</title>
    <style>
        body{
            font-family:'Segoe UI, Tahoma, Geneva, Verdana, sans-serif';
            text-align: center;
            background-color: #f4f4f9;
            padding-top: 100px;
        }
        .card{
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: inline;
        }
        h1{
            color: #333;
            margin-top: 0;
        }
        .valor{
            font-size: 5em;
            font-weight: bold;
            color: #0078d7;
        }
        .unidade{
            font-size: 0.3em;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Distancia Atual</h1>
        <div class="valor" id="distancia-display"> -- 
            <span class="unidade">cm</span>
        </div>
        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
        <h3 style="color: #666; font-size: 1.2em; margin-bottom: 10px">Registros</h3>
    </div>
    <script>
        function buscaDistancia(){
            fetch('/api/dados')
            .then(response => response.json())
            .then(data =>{
                document.getElementById('distancia-display').innerHTML = Fixed(2) + '<span class="unidade">cm</span>'
            })
        }
    </script>
</body>
</html>
